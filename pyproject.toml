[build-system]
requires      = ["hatchling"]
build-backend = "hatchling.build"

[project]
name        = "nsh"
version     = "0.1.0"
description = "Natural Shell — translate natural language to Ubuntu commands via Claude"
readme      = "CLAUDE.md"
license     = { text = "MIT" }
requires-python = ">=3.13"
authors     = [{ name = "CoolLiang", email = "CoolLiang@users.noreply.github.com" }]
keywords    = ["cli", "shell", "natural-language", "anthropic", "ubuntu"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Shells",
    "Topic :: Utilities",
]
dependencies = [
    "typer>=0.15",
    "rich>=13",
    "anthropic>=0.40",
]

[project.scripts]
nsh = "nsh.main:main"

[project.urls]
Homepage = "https://github.com/CoolLiang/nsh"
Issues   = "https://github.com/CoolLiang/nsh/issues"

[tool.hatch.build.targets.wheel]
packages = ["nsh"]

[tool.hatch.build.targets.sdist]
include = ["nsh", "tests"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths  = ["tests"]
